# ArchPOWER, powerpc64, base-any.
#
# Mirrored to ghcr.io/pkgforge-dev/mirror-archlinux/powerpc64/base-any.
# Read by scripts/lib.sh, never sourced. One key per line, `key = value`.

arch = powerpc64
repo = base-any

# ArchPOWER's only host. It signs every database. The any database is at
# base/any, not at $repo/$arch.
db_server = https://repo.archlinuxpower.org/base/any
db_signed = yes

# pacman verifies in the x86_64 Arch image, with Architecture set to the
# target's arch: no emulation.
# tag: base
verify_image = docker.io/library/archlinux:base@sha256:3c64b538588416593f69a1aebd2f2ec0f2541b29159f32556fa7def2167147a0
verify_platform = linux/amd64

# The trust root: the keyring files of the powerpc64 image of
# pkgforge-dev/docker-archlinux, copied out of it and never run.
# tag: ppc64
keyring_image = ghcr.io/pkgforge-dev/archlinux:ppc64@sha256:eaaddd83677fc268dd4d284ec63950cea5dc9c7f53a5a00dfe92b126fd166206
keyring_platform = linux/ppc64

# The keyring package is in this repository.
keyring = archpower-keyring
