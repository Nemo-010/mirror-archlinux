# ArchPOWER, powerpc64le, base.
#
# Mirrored to ghcr.io/pkgforge-dev/mirror-archlinux/powerpc64le/base.
# Read by scripts/lib.sh, never sourced. One key per line, `key = value`.

arch = powerpc64le
repo = base

# ArchPOWER's only host. It signs every database.
db_server = https://repo.archlinuxpower.org/$repo/$arch
db_signed = yes

# pacman verifies in the x86_64 Arch image, with Architecture set to the
# target's arch: no emulation.
# tag: base
verify_image = docker.io/library/archlinux:base@sha256:3c64b538588416593f69a1aebd2f2ec0f2541b29159f32556fa7def2167147a0
verify_platform = linux/amd64

# The trust root: the keyring files of the powerpc64le image of
# pkgforge-dev/docker-archlinux, copied out of it and never run.
# tag: ppc64le
keyring_image = ghcr.io/pkgforge-dev/archlinux:ppc64le@sha256:730c3adc237cb16f2614bf0b2392e1853056eab13d1a27a8c77a54ce23ac527c
keyring_platform = linux/ppc64le

# The keyring package is in base-any: verify installs it from the promoted
# powerpc64le base-any first.
keyring = archpower-keyring
keyring_from = powerpc64le-base-any
